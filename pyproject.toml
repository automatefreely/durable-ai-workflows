[project]
name = "durable-ai-workflows"
version = "1.0.0"
description = "Reproducible crash-recovery experiments for AI workflows"
requires-python = ">=3.12,<3.13"
dependencies = ["temporalio>=1.18,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "openai>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
