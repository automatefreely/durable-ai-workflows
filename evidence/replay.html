<main><div class="label">AUTOMATE FREELY · RECORDED EVIDENCE REPLAY</div><h1>A worker can die after the invoice is saved</h1><h2 id="variant"></h2><div class="stats"><div class="stat">Committed invoices<br><strong id="invoices">0</strong></div><div class="stat">Actual worker exit<br><strong id="exit">—</strong></div><div class="stat">Model calls<br><strong id="model">1</strong></div></div><div id="events" role="log"></div><p id="caption"></p><button id="play">Replay both experiments</button><footer><small>Playback of saved JSONL events, not a live system. Pauses compressed for readability.</small><div id="source"></div></footer></main><script>
const runs=[{"result": {"run_id": "1ee30a2c21ab4201ad1b73d918d0973d", "workflow_id": "invoice:synthetic-tenant:1ee30a2c21ab4201ad1b73d918d0973d", "variant": "temporal", "scenario": "crash_after", "repetition": 9, "status": "completed", "invoice_count": 2, "duplicate_count": 1, "model_calls": 1, "activity_attempts": 2, "invoice_requests": 2, "elapsed_s": 15.5892, "recovery_s": 12.9288, "assertions_passed": true}, "events": [{"seq": 992, "ts": 1794236372.3583694, "operation_id": "1ee30a2c21ab4201ad1b73d918d0973d", "kind": "invoice_request", "detail": {"key": null}, "source": "receiver"}, {"seq": 993, "ts": 1794236372.3587348, "operation_id": "1ee30a2c21ab4201ad1b73d918d0973d", "kind": "invoice_committed", "detail": {"invoice_id": "1e63d30b-eb78-4aa5-923d-64781ddb88b7"}, "source": "receiver"}, {"seq": 994, "ts": 1794236372.424215, "operation_id": "1ee30a2c21ab4201ad1b73d918d0973d", "kind": "response_received", "detail": {}, "source": "receiver"}, {"seq": 995, "ts": 1794236372.5584476, "operation_id": "1ee30a2c21ab4201ad1b73d918d0973d", "kind": "after_commit_barrier", "detail": {}, "source": "receiver"}, {"ts": 1794236372.5729678, "operation_id": "1ee30a2c21ab4201ad1b73d918d0973d", "kind": "worker_killed", "detail": {"returncode": -9}, "source": "harness"}, {"ts": 1794236372.5736518, "operation_id": "1ee30a2c21ab4201ad1b73d918d0973d", "kind": "worker_restarted", "detail": {"pid": 798}, "source": "harness"}, {"seq": 997, "ts": 1794236375.2965071, "operation_id": "1ee30a2c21ab4201ad1b73d918d0973d", "kind": "invoice_request", "detail": {"key": null}, "source": "receiver"}, {"seq": 998, "ts": 1794236375.2967284, "operation_id": "1ee30a2c21ab4201ad1b73d918d0973d", "kind": "invoice_committed", "detail": {"invoice_id": "edd4fb86-7146-44c3-80de-4287a75168a1"}, "source": "receiver"}, {"seq": 999, "ts": 1794236375.369484, "operation_id": "1ee30a2c21ab4201ad1b73d918d0973d", "kind": "response_received", "detail": {}, "source": "receiver"}]}, {"result": {"run_id": "5f1bae5d3c3944c59ea29abffbb330aa", "workflow_id": "invoice:synthetic-tenant:5f1bae5d3c3944c59ea29abffbb330aa", "variant": "protected", "scenario": "crash_after", "repetition": 1, "status": "completed", "invoice_count": 1, "duplicate_count": 0, "model_calls": 1, "activity_attempts": 2, "invoice_requests": 2, "elapsed_s": 15.5523, "recovery_s": 12.9276, "assertions_passed": true}, "events": [{"seq": 1483, "ts": 1794236790.2419274, "operation_id": "5f1bae5d3c3944c59ea29abffbb330aa", "kind": "invoice_request", "detail": {"key": "synthetic-tenant:5f1bae5d3c3944c59ea29abffbb330aa:create-invoice"}, "source": "receiver"}, {"seq": 1484, "ts": 1794236790.2421405, "operation_id": "5f1bae5d3c3944c59ea29abffbb330aa", "kind": "invoice_committed", "detail": {"invoice_id": "9482f3ec-de76-4d85-9b97-9b1a49ef0277"}, "source": "receiver"}, {"seq": 1485, "ts": 1794236790.3043363, "operation_id": "5f1bae5d3c3944c59ea29abffbb330aa", "kind": "response_received", "detail": {}, "source": "receiver"}, {"seq": 1486, "ts": 1794236790.4403236, "operation_id": "5f1bae5d3c3944c59ea29abffbb330aa", "kind": "after_commit_barrier", "detail": {}, "source": "receiver"}, {"ts": 1794236790.453484, "operation_id": "5f1bae5d3c3944c59ea29abffbb330aa", "kind": "worker_killed", "detail": {"returncode": -9}, "source": "harness"}, {"ts": 1794236790.4551148, "operation_id": "5f1bae5d3c3944c59ea29abffbb330aa", "kind": "worker_restarted", "detail": {"pid": 1632}, "source": "harness"}, {"seq": 1488, "ts": 1794236793.1765752, "operation_id": "5f1bae5d3c3944c59ea29abffbb330aa", "kind": "invoice_request", "detail": {"key": "synthetic-tenant:5f1bae5d3c3944c59ea29abffbb330aa:create-invoice"}, "source": "receiver"}, {"seq": 1489, "ts": 1794236793.176784, "operation_id": "5f1bae5d3c3944c59ea29abffbb330aa", "kind": "invoice_reused", "detail": {"invoice_id": "9482f3ec-de76-4d85-9b97-9b1a49ef0277"}, "source": "receiver"}, {"seq": 1490, "ts": 1794236793.24148, "operation_id": "5f1bae5d3c3944c59ea29abffbb330aa", "kind": "response_received", "detail": {}, "source": "receiver"}]}];
const labels={invoice_request:'Invoice HTTP request received',invoice_committed:'Invoice committed in receiver database',response_received:'Worker received successful HTTP response',after_commit_barrier:'Barrier reached before Activity completion',worker_killed:'Worker killed (SIGKILL)',worker_restarted:'Replacement worker started',invoice_reused:'Existing invoice ID returned from receipt'};
const $=id=>document.getElementById(id);
const pause=ms=>new Promise(r=>setTimeout(r,ms));
async function playback(){ $('play').disabled=true;
for (const run of runs){
$('variant').textContent=run.result.variant==='temporal'?'Control: Temporal WITHOUT receiver idempotency':'Protected: Temporal WITH receiver idempotency';$('events').innerHTML='';$('invoices').textContent='0';$('exit').textContent='—';$('model').textContent=run.result.model_calls;$('source').textContent='Saved run '+run.result.run_id+' · scenario crash_after';$('caption').textContent='The same approved operation will be attempted again after the worker is killed.';let n=0;const first=run.events[0].ts;
await pause(1200);
for(const e of run.events){
let row=document.createElement('div');row.className='event';if(e.kind==='worker_killed'){row.classList.add('bad');$('exit').textContent=e.detail.returncode;}
if(e.kind==='invoice_reused')row.classList.add('good');
row.textContent='+'+(e.ts-first).toFixed(2)+'s  '+(labels[e.kind]||e.kind);$('events').append(row);$('events').scrollTop=$('events').scrollHeight;
if(e.kind==='invoice_committed')$('invoices').textContent=++n;
if(e.kind==='worker_killed')$('caption').textContent='The invoice exists, but the workflow has no completed Activity result.';
if(e.kind==='invoice_reused')$('caption').textContent='The retry uses the same key. The receiver returns the original invoice.';
await pause(1000);
}
$('caption').textContent=run.result.variant==='temporal'?'Observed result: 2 invoices. Durable recovery repeated an unprotected external effect.':'Observed result: 1 invoice. Two requests, one committed effect under this receiver contract.';
await pause(3600);
}
$('play').disabled=false;window.playbackDone=true;}
$('play').onclick=()=>{window.playbackDone=false;playback()};window.playback=playback;
</script></html>
