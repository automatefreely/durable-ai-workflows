name: durable-ai-workflows
x-app: &app
  build: .
  image: durable-ai-workflows:1.0.0
  environment: &app-env
    TEMPORAL_ADDRESS: temporal:7233
    INVOICE_URL: http://invoice:8000
    NO_PROXY: localhost,127.0.0.1,0.0.0.0,temporal,invoice
    no_proxy: localhost,127.0.0.1,0.0.0.0,temporal,invoice
  depends_on:
    temporal:
      condition: service_healthy
    invoice:
      condition: service_healthy
services:
  temporal:
    image: temporalio/temporal:1.4.1@sha256:9844298258519ebece82b3253f1ee1fc4eb8d87b7abcc264cfb676be342c74a5
    # The dev image's default uid cannot initialize a fresh root-owned named volume.
    user: "0:0"
    command: server start-dev --ip 0.0.0.0 --db-filename /data/temporal.db
    environment:
      NO_PROXY: localhost,127.0.0.1,0.0.0.0
      no_proxy: localhost,127.0.0.1,0.0.0.0
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal-state:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 2s
      timeout: 3s
      retries: 30
  invoice:
    build: .
    image: durable-ai-workflows:1.0.0
    command: uvicorn lab.service:app --host 0.0.0.0 --port 8000
    environment:
      INVOICE_DB: /state/invoices.db
      LAB_TEST_MODE: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - invoice-state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
  worker:
    <<: *app
    profiles: ["interactive"]
  runner:
    <<: *app
    profiles: ["experiment"]
    command: python -m lab.run --repeat 10 --output /artifacts/latest
    environment:
      <<: *app-env
      LAB_SOURCE_COMMIT: ${LAB_SOURCE_COMMIT:-unrecorded}
    volumes:
      - ./artifacts:/artifacts
volumes:
  temporal-state:
  invoice-state:
